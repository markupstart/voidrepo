name: Build Void Packages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            ca-certificates
      
      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /void-packages
      
      - name: Prepare build environment
        run: |
          cd /void-packages
          ./xbps-src binary-bootstrap
      
      - name: Link custom packages
        run: |
          for pkg in $GITHUB_WORKSPACE/srcpkgs/*; do
            if [ -d "$pkg" ] && [ "$(basename "$pkg")" != ".gitkeep" ]; then
              pkg_name=$(basename "$pkg")
              ln -sf "$pkg" "/void-packages/srcpkgs/$pkg_name"
              echo "Linked: $pkg_name"
            fi
          done
      
      - name: Build packages
        run: |
          cd /void-packages
          mkdir -p $GITHUB_WORKSPACE/binpkgs
          
          for pkg in $GITHUB_WORKSPACE/srcpkgs/*; do
            if [ -d "$pkg" ] && [ "$(basename "$pkg")" != ".gitkeep" ]; then
              pkg_name=$(basename "$pkg")
              echo "Building: $pkg_name"
              ./xbps-src pkg "$pkg_name"
              
              # Copy built package
              ARCH=$(xbps-uhelper arch)
              pkg_file=$(find hostdir/binpkgs -name "${pkg_name}-*.${ARCH}.xbps" -type f | sort -V | tail -1)
              if [ -n "$pkg_file" ]; then
                cp -v "$pkg_file" $GITHUB_WORKSPACE/binpkgs/
              fi
            fi
          done
      
      - name: Create repository index
        run: |
          cd $GITHUB_WORKSPACE/binpkgs
          if ls *.xbps 1> /dev/null 2>&1; then
            xbps-rindex -a *.xbps
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-packages
          path: binpkgs/*.xbps
          retention-days: 30
      
      - name: Upload repository index
        uses: actions/upload-artifact@v4
        with:
          name: repository-data
          path: |
            binpkgs/*-repodata
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: void-packages
          path: binpkgs
      
      - name: Download repository data
        uses: actions/download-artifact@v4
        with:
          name: repository-data
          path: binpkgs
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install GitHub CLI if not available
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install -y gh
          fi
          
          # Create release with date tag
          TAG="v$(date +%Y.%m.%d-%H%M)"
          
          # Check if there are packages to release
          if ls binpkgs/*.xbps 1> /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $(date +%Y-%m-%d)" \
              --notes "Automated build of custom Void Linux packages" \
              binpkgs/*.xbps binpkgs/*-repodata
            
            # Also update 'latest' tag
            gh release delete latest --yes || true
            git tag -f latest
            git push -f origin latest
            gh release create latest \
              --title "Latest Build" \
              --notes "Latest build of custom Void Linux packages. Always points to the most recent build." \
              --latest \
              binpkgs/*.xbps binpkgs/*-repodata
          else
            echo "No packages to release"
          fi

name: Build Void Packages

on:
  push:
    branches: [main, master]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VOID_PACKAGES_DIR: ${{ github.workspace }}/void-packages
      XBPS_ARCH: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git "$VOID_PACKAGES_DIR"

      - name: Bootstrap xbps-src (glibc)
        run: |
          cd "$VOID_PACKAGES_DIR"
          # Explicitly bootstrap for x86_64 glibc (not musl)
          ./xbps-src binary-bootstrap x86_64

      - name: Link custom templates
        run: |
          echo "=== Copying custom packages ==="
          echo "Source: ${{ github.workspace }}/srcpkgs"
          echo "Target: $VOID_PACKAGES_DIR/srcpkgs"
          
          # Copy packages to void-packages
          for pkg in ${{ github.workspace }}/srcpkgs/*; do
            if [ -d "$pkg" ] && [ "$(basename "$pkg")" != ".gitkeep" ]; then
              name="$(basename "$pkg")"
              if [ -f "$pkg/template" ]; then
                echo "Copying $name..."
                cp -r "$pkg" "$VOID_PACKAGES_DIR/srcpkgs/$name"
              fi
            fi
          done

      - name: Build packages
        run: |
          set -euo pipefail
          cd "$VOID_PACKAGES_DIR"
          mkdir -p ${{ github.workspace }}/binpkgs

          # Build order matters for ROCm packages (dependency order)
          BUILD_ORDER=(
            rocm-cmake
            rocm-llvm
            rocm-device-libs
            rocm-comgr
            rocr-runtime
            rocminfo
            rocm-opencl
            hip-runtime-amd
            hipcc
            vscode-bin
            zen-browser
          )

          for name in "${BUILD_ORDER[@]}"; do
            if [ -d "$VOID_PACKAGES_DIR/srcpkgs/$name" ]; then
              echo ""
              echo "========================================"
              echo "Building: $name (glibc)"
              echo "========================================"
              # Explicitly build for x86_64 glibc
              ./xbps-src -a x86_64 pkg "$name" || {
                echo "⚠ Failed to build $name"
                echo "⚠ This may cause dependent packages to fail"
                continue
              }
            else
              echo "⚠ Skipping $name (not found in srcpkgs)"
            fi
          done

          echo ""
          echo "Copying built packages..."
          find hostdir/binpkgs -type f -name "*.xbps" -exec cp -v {} ${{ github.workspace }}/binpkgs/ \;

      - name: Create repository index
        run: |
          cd ${{ github.workspace }}/binpkgs
          test -n "$(ls -1 *.xbps 2>/dev/null)" || { echo "No packages built"; exit 1; }
          "$VOID_PACKAGES_DIR/hostdir/binpkgs/xbps-rindex" -a *.xbps

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-repo
          path: |
            binpkgs/*.xbps
            binpkgs/*-repodata
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: void-repo
          path: binpkgs

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install GitHub CLI if not available
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install -y gh
          fi

          # Create release with date tag
          TAG="v$(date +%Y.%m.%d-%H%M)"

          # Check if there are packages to release
          if ls binpkgs/*.xbps 1> /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $(date +%Y-%m-%d)" \
              --notes "Automated build of custom Void Linux packages" \
              binpkgs/*.xbps binpkgs/*-repodata

            # Also update 'latest' tag
            gh release delete latest --yes || true
            git tag -f latest
            git push -f origin latest
            gh release create latest \
              --title "Latest Build" \
              --notes "Latest build of custom Void Linux packages. Always points to the most recent build." \
              --latest \
              binpkgs/*.xbps binpkgs/*-repodata
          else
            echo "No packages to release"
          fi

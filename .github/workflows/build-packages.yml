name: Build Void Packages

on:
  push:
    branches: [main, master]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VOID_PACKAGES_DIR: ${{ github.workspace }}/void-packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl ca-certificates xz-utils

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git "$VOID_PACKAGES_DIR"

      - name: Bootstrap xbps-src
        run: |
          cd "$VOID_PACKAGES_DIR"
          ./xbps-src binary-bootstrap

      - name: Link custom templates
        run: |
          mkdir -p "$VOID_PACKAGES_DIR/srcpkgs"
          for pkg in "$GITHUB_WORKSPACE"/srcpkgs/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/template" ]; then
              name="$(basename "$pkg")"
              ln -sfn "$pkg" "$VOID_PACKAGES_DIR/srcpkgs/$name"
              echo "Linked $name"
            fi
          done

      - name: Build packages
        run: |
          set -euo pipefail
          cd "$VOID_PACKAGES_DIR"
          mkdir -p "$GITHUB_WORKSPACE/binpkgs"

          for pkg in "$GITHUB_WORKSPACE"/srcpkgs/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/template" ]; then
              name="$(basename "$pkg")"
              echo "Building $name"
              ./xbps-src pkg "$name"
            fi
          done

          find hostdir/binpkgs -type f -name "*.xbps" -exec cp -v {} "$GITHUB_WORKSPACE/binpkgs/" \;

      - name: Create repository index
        run: |
          cd "$GITHUB_WORKSPACE/binpkgs"
          test -n "$(ls -1 *.xbps 2>/dev/null)" || { echo "No packages built"; exit 1; }
          xbps-rindex -a *.xbps

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-repo
          path: |
            binpkgs/*.xbps
            binpkgs/*-repodata
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: void-repo
          path: binpkgs

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install GitHub CLI if not available
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install -y gh
          fi

          # Create release with date tag
          TAG="v$(date +%Y.%m.%d-%H%M)"

          # Check if there are packages to release
          if ls binpkgs/*.xbps 1> /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $(date +%Y-%m-%d)" \
              --notes "Automated build of custom Void Linux packages" \
              binpkgs/*.xbps binpkgs/*-repodata

            # Also update 'latest' tag
            gh release delete latest --yes || true
            git tag -f latest
            git push -f origin latest
            gh release create latest \
              --title "Latest Build" \
              --notes "Latest build of custom Void Linux packages. Always points to the most recent build." \
              --latest \
              binpkgs/*.xbps binpkgs/*-repodata
          else
            echo "No packages to release"
          fi

          fi
